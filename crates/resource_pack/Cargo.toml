[package]
name = "resource_pack"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true

[features]
texture = ["dep:ktx2", "dep:zstd", "dep:ruzstd"]
cli = ["dep:tempfile", "texture"]

[[bin]]
name = "resource_pack"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
ktx2 = { version = "0.5", optional = true }
thiserror.workspace = true
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs", "zstd"] }
tempfile = { version = "3", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd = { version = "0.14", default-features = false, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ruzstd = { version = "0.9", optional = true }

[lints]
workspace = true
