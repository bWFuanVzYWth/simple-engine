[package]
name = "fft_bloom"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true

[features]
default = []
calibration = ["dep:color", "dep:perlin_noise", "dep:serde"]
calibration_gpu = ["calibration", "vulkan", "dep:bytemuck"]
vulkan = ["dep:vulkan", "dep:shader_build", "dep:resource_pack"]

[dependencies]
resource_pack = { path = "../resource_pack", features = ["texture"] }
perlin_noise = { path = "../perlin_noise", optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
bytemuck = { workspace = true, features = ["derive"], optional = true }
color = { path = "../color", features = ["spectrum"], optional = true }
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vulkan = { path = "../vulkan", optional = true }

[dev-dependencies]
sha2 = "0.11.1"
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster.workspace = true
gpu_log = { path = "../gpu_log" }

[[bench]]
name = "diffraction"
harness = false
required-features = ["calibration_gpu"]

[build-dependencies]
resource_pack = { path = "../resource_pack", features = ["texture"], optional = true }
shader_build = { path = "../shader_build", optional = true }

[lints]
workspace = true
