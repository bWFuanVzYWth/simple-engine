[package]
name = "render2d"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true

[features]
default = []
text = ["dep:cosmic-text", "dep:swash", "dep:unicode-segmentation", "dep:input"]
gpu = ["dep:wgpu", "dep:bytemuck", "dep:shader_build", "dep:serde_json", "dep:thiserror"]

[dependencies]
thiserror.workspace = true
color = { path = "../color" }
input = { path = "../input", optional = true }
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash", "wasm-web"], optional = true }
unicode-segmentation = { version = "1.13.3", optional = true }
swash = { version = "0.2.10", default-features = false, optional = true }
wgpu = { workspace = true, optional = true }
bytemuck = { workspace = true, features = ["derive"], optional = true }

[build-dependencies]
shader_build = { path = "../shader_build", optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "scene"
harness = false

[[bench]]
name = "text"
harness = false
required-features = ["text"]

[lints]
workspace = true
